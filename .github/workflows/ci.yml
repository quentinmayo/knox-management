name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: knox-management
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quentinmayo/StepDownproxy
          ref: v0.1.0
          path: StepDownproxy
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Format, tests, vet, real Knox integration
        working-directory: knox-management
        run: |
          test -z "$(gofmt -l cmd internal integration)"
          go test -race -cover ./...
          go vet ./...
          cd ../StepDownproxy
          go build -o /tmp/stepdownproxy ./cmd/stepdownproxy
          cd ../knox-management/integration
          STEPDOWN_PROXY_BINARY=/tmp/stepdownproxy GOWORK=off go test -race -v ./...
      - name: Dependency vulnerability scan
        working-directory: knox-management
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          cd integration
          GOWORK=off govulncheck ./...
      - name: Git history secret scan
        working-directory: knox-management
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /src --redact --no-banner
      - name: Docker demo smoke
        working-directory: knox-management
        run: |
          python3 scripts/init-demo.py
          docker compose -f compose.demo.yaml up --build -d
          python3 scripts/smoke.py
          python3 scripts/cli-smoke.py
      - name: Stop demo
        if: always()
        working-directory: knox-management
        run: docker compose -f compose.demo.yaml down
